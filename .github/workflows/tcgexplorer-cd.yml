on:
  push:
    branches: [main]

name: TCG Explorer Deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Self-Hosted Registry
      uses: docker/login-action@v3
      with:
        registry: registry.melinakrzemowa.pl
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Get the hash
      id: get_hash
      run: |
        echo "HASH=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: "Get Previous tag"
      id: previoustag
      uses: "WyriHaximus/github-action-get-previous-tag@master"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/arm64/v8
        tags: |
          registry.melinakrzemowa.pl/tcgexplorer:latest
          registry.melinakrzemowa.pl/tcgexplorer:${{ steps.previoustag.outputs.tag }}
          registry.melinakrzemowa.pl/tcgexplorer:${{ steps.previoustag.outputs.tag }}-${{ steps.get_hash.outputs.HASH }}
        build-args: |
          VERSION=${{ steps.previoustag.outputs.tag }}
          VERSION_HASH=${{ steps.get_hash.outputs.HASH }}
        cache-from: |
          type=registry,ref=registry.melinakrzemowa.pl/tcgexplorer:buildcache
          type=registry,ref=registry.melinakrzemowa.pl/tcgexplorer:latest
        cache-to: type=registry,ref=registry.melinakrzemowa.pl/tcgexplorer:buildcache,mode=max

    - name: Copy docker-compose.yml
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/home/${{ secrets.SSH_USERNAME }}/deploy/tcgexplorer/"
        overwrite: true

    - name: Update service using docker-compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        script: |
          sudo mv /home/${{ secrets.SSH_USERNAME }}/deploy/tcgexplorer/docker-compose.yml /var/www/tcgexplorer.com/docker-compose.yml
          export VERSION=${{ steps.previoustag.outputs.tag }}
          export VERSION_HASH=${{ steps.get_hash.outputs.HASH }}
          cd /var/www/tcgexplorer.com
          docker pull registry.melinakrzemowa.pl/tcgexplorer:${VERSION}
          docker compose up -d