on:
  release:
    types: [published]

name: TCG Explorer Deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF##*/}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          kelu/tcgexplorer:latest
          kelu/tcgexplorer:${{ steps.get_version.outputs.VERSION }}

    - name: Copy docker-compose.yml
      uses: appleboy/scp-action@master
      with:
        host: tcgexplorer.com
        username: kelu
        key: ${{ secrets.PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/var/www/tcgexplorer.com"
        overwrite: true

    - name: Update service using docker-compose
      uses: appleboy/ssh-action@master
      with:
        host: tcgexplorer.com
        username: kelu
        key: ${{ secrets.PRIVATE_KEY }}
        script: export VERSION=${{ steps.get_version.outputs.VERSION }} && cd /var/www/tcgexplorer.com && docker-compose up --no-deps -d web
