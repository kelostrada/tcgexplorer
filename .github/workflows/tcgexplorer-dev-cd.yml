name: TCG Explorer DEV Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy DEV
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          kelu/tcgexplorer:latest

    - name: Copy docker-compose.yml
      uses: appleboy/scp-action@master
      with:
        host: tcgexplorer.com
        username: kelu
        key: ${{ secrets.PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/var/www/dev.tcgexplorer.com"
        overwrite: true

    - name: Update service using docker-compose
      uses: appleboy/ssh-action@master
      with:
        host: tcgexplorer.com
        username: kelu
        key: ${{ secrets.PRIVATE_KEY }}
        script: export VERSION=latest && cd /var/www/dev.tcgexplorer.com && docker-compose up --no-deps -d web
