services:
  db:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcg_explorer
  web:
    image: registry.melinakrzemowa.pl/tcgexplorer:${VERSION}
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ${DATABASE_URL}
      HOST: ${HOST}
      VERSION: ${VERSION}
    ports:
      - "${PORT}:4000"
    depends_on:
      - db
